<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shutdown Routine</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818CF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        /* Animations */
        .moon-animation { animation: moonrise 4s ease-in-out; }
        @keyframes moonrise {
            0% { transform: translateY(100px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-20px); opacity: 1; }
        }
        .glow { animation: gentle-glow 3s ease-in-out infinite; }
        @keyframes gentle-glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(147, 197, 253, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(147, 197, 253, 0.8)); }
        }
        .fade-out { animation: fadeOut 1s ease-in-out forwards; }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .fade-in { animation: fadeIn 1s ease-in-out; }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .editor-surface {
            min-height: 260px;
            outline: none;
            line-height: 1.55;
            word-break: break-word;
        }
        .editor-surface.editor-empty::before {
            content: attr(data-placeholder);
            color: #9ca3af;
        }
        .editor-surface ul {
            list-style: disc;
            margin: 0 0 0 1.25rem;
            padding: 0;
        }
        .editor-surface p {
            margin: 0 0 0.45rem;
        }
        .editor-surface p[data-spacing="m"] {
            margin-bottom: 8pt;
        }
        .editor-surface p[data-spacing="l"] {
            margin-bottom: 16pt;
        }
        .editor-surface p[data-spacing="xl"] {
            margin-bottom: 12pt;
        }
        .editor-surface-relaxed p {
            margin: 0 0 1rem;
        }
        .editor-surface-relaxed p[data-spacing="m"] {
            margin-bottom: 12pt;
        }
        .editor-surface-relaxed p[data-spacing="l"] {
            margin-bottom: 14pt;
        }
        .editor-surface-relaxed p[data-spacing="xl"] {
            margin-bottom: 16pt;
        }
        .editor-surface p:last-child {
            margin-bottom: 0;
        }
        .editor-surface font[size="2"] {
            font-size: 0.85rem;
        }
        .editor-surface font[size="3"] {
            font-size: 1rem;
        }
        .editor-surface font[size="4"] {
            font-size: 1.12rem;
        }
        .editor-surface font[size="5"] {
            font-size: 1.32rem;
        }
        .editor-surface font[size="6"] {
            font-size: 1.6rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEYS = {
            mantras: 'shutdownRoutineMantrasContent',
            lessons: 'shutdownRoutineLessonsContent'
        };

        const STARTER_CONTENT = {
            mantras: `
                <p><strong>I release the day with peace.</strong></p>
                <p>I honor what was done, let go of what can wait, and return to myself with gentleness.</p>
                <ul><li>I have done enough for today.</li><li>Rest restores my clarity.</li><li>I welcome a calm evening.</li></ul>
            `,
            lessons: `
                <p><strong>Evening reflection prompt:</strong> What did today teach me, and what can I set down before rest?</p>
                <p>Capture the insight worth carrying forward and the tension that no longer needs your attention tonight.</p>
                <ul><li>Lesson from today</li><li>What I can release</li><li>What tomorrow can hold</li></ul>
            `
        };

        const MODAL_STEP_CONFIG = {
            5: {
                key: 'mantras',
                title: 'Mantras',
                headerLabel: 'SHUTDOWN ROUTINE ⋆ MANTRAS',
                storageKey: STORAGE_KEYS.mantras,
                placeholder: 'Write your mantras and affirmations here...'
            },
            6: {
                key: 'lessons',
                title: 'Lessons & Wisdom',
                headerLabel: 'SHUTDOWN ROUTINE ⋆ LESSONS',
                storageKey: STORAGE_KEYS.lessons,
                placeholder: 'Capture your lessons, insights, and wisdom here...',
                editorClassName: 'editor-surface-relaxed'
            }
        };

        const FONT_SIZE_OPTIONS = [
            { label: 'XS', value: '2' },
            { label: 'S', value: '3' },
            { label: 'M', value: '4' },
            { label: 'L', value: '5' },
            { label: 'XL', value: '6' }
        ];

        const TOTAL_STEPS = 11;

        const getScreenFromHash = (hash = window.location.hash) => {
            const normalized = (hash || '').replace(/^#/, '').trim().toLowerCase();

            if (!normalized || normalized === '/' || normalized === '/moonrise') {
                return 'moonrise';
            }
            if (normalized === '/welcome') return 'welcome';
            if (normalized === '/complete') return 'complete';

            const stepMatch = normalized.match(/^\/step(\d+)$/);
            if (stepMatch) {
                const stepNumber = parseInt(stepMatch[1], 10);
                if (stepNumber >= 1 && stepNumber <= TOTAL_STEPS) {
                    return `step-${stepNumber}`;
                }
            }

            return 'moonrise';
        };

        const getHashFromScreen = (screen) => {
            if (!screen || screen === 'moonrise') return '#/';
            if (screen === 'welcome') return '#/welcome';
            if (screen === 'complete') return '#/complete';

            if (screen.startsWith('step-')) {
                const stepNumber = parseInt(screen.split('-')[1], 10);
                if (stepNumber >= 1 && stepNumber <= TOTAL_STEPS) {
                    return `#/step${stepNumber}`;
                }
            }

            return '#/';
        };

        const normalizeEditorHtml = (html) => {
            if (!html) return '';
            const trimmed = html.replace(/\u200B/g, '').trim();
            return trimmed === '<br>' || trimmed === '<p><br></p>' ? '' : html;
        };

        const applyEditorSpacing = (root) => {
            if (!root) return;

            Array.from(root.querySelectorAll('p')).forEach((block) => {
                const sizeValues = [block, ...block.querySelectorAll('font[size]')]
                    .map((node) => parseInt(node.getAttribute && node.getAttribute('size'), 10))
                    .filter((value) => !Number.isNaN(value));

                const maxSize = sizeValues.length ? Math.max(...sizeValues) : 3;
                let spacing = 'default';

                if (maxSize >= 6) spacing = 'xl';
                else if (maxSize === 5) spacing = 'l';
                else if (maxSize === 4) spacing = 'm';

                block.setAttribute('data-spacing', spacing);
            });
        };

        const normalizeEditorStructure = (root) => {
            if (!root) return;

            const children = Array.from(root.childNodes);
            if (children.length === 0) {
                root.innerHTML = '<p><br></p>';
                return;
            }

            children.forEach((node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent || '';
                    if (text.trim()) {
                        const paragraph = document.createElement('p');
                        paragraph.textContent = text;
                        root.replaceChild(paragraph, node);
                    } else {
                        root.removeChild(node);
                    }
                    return;
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return;
                }

                const tagName = node.tagName.toLowerCase();

                if (tagName === 'div') {
                    const paragraph = document.createElement('p');
                    while (node.firstChild) {
                        paragraph.appendChild(node.firstChild);
                    }
                    root.replaceChild(paragraph, node);
                    return;
                }

                if (tagName === 'br') {
                    const paragraph = document.createElement('p');
                    paragraph.appendChild(document.createElement('br'));
                    root.replaceChild(paragraph, node);
                    return;
                }

                if (tagName !== 'p' && tagName !== 'ul') {
                    const paragraph = document.createElement('p');
                    root.replaceChild(paragraph, node);
                    paragraph.appendChild(node);
                }
            });

            if (!root.querySelector('p, ul')) {
                root.innerHTML = '<p><br></p>';
            }
        };

        const prepareEditorDom = (root) => {
            normalizeEditorStructure(root);
            applyEditorSpacing(root);
        };

        const syncEditorPresentation = (root) => {
            if (!root) return;
            applyEditorSpacing(root);
        };

        const getStoredContent = (storageKey, fallback) => {
            const saved = window.localStorage.getItem(storageKey);
            return saved && saved.trim() ? saved : fallback;
        };

        const saveStoredContent = (storageKey, content) => {
            window.localStorage.setItem(storageKey, content);
        };

        const ToolbarButton = ({ label, onClick, title, className = '' }) => (
            <button
                type="button"
                onClick={onClick}
                title={title}
                aria-label={title}
                className={`inline-flex h-9 min-w-9 items-center justify-center rounded-xl bg-violet-50 px-2.5 py-1.5 text-gray-700 font-semibold text-sm hover:bg-violet-100 transition-colors ${className}`}
            >
                {label}
            </button>
        );

        const ListIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M7 5h8"></path>
                <path d="M7 10h8"></path>
                <path d="M7 15h8"></path>
                <circle cx="4" cy="5" r="0.9" fill="currentColor" stroke="none"></circle>
                <circle cx="4" cy="10" r="0.9" fill="currentColor" stroke="none"></circle>
                <circle cx="4" cy="15" r="0.9" fill="currentColor" stroke="none"></circle>
            </svg>
        );

        const AlignLeftIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className={className}>
                <path d="M4 5h11"></path>
                <path d="M4 8.5h8"></path>
                <path d="M4 12h11"></path>
                <path d="M4 15.5h7"></path>
            </svg>
        );

        const AlignCenterIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className={className}>
                <path d="M4.5 5h11"></path>
                <path d="M6.5 8.5h7"></path>
                <path d="M4.5 12h11"></path>
                <path d="M6.5 15.5h7"></path>
            </svg>
        );

        const AlignRightIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className={className}>
                <path d="M5 5h11"></path>
                <path d="M8 8.5h8"></path>
                <path d="M5 12h11"></path>
                <path d="M9 15.5h7"></path>
            </svg>
        );

        // --- ICONS ---
        const MoonIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
        );
        const ClockIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );
        const ChevronRightIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );
        const ArrowLeftIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        );
        const CheckIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );
        const RefreshCwIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path>
            </svg>
        );

        const RichTextModal = ({ isOpen, title, headerLabel, storageKey, starterContent, placeholder, editorClassName = '', onClose }) => {
            const editorRef = useRef(null);
            const selectionRef = useRef(null);
            const [isEmpty, setIsEmpty] = useState(false);

            useEffect(() => {
                if (!isOpen) return;

                const nextContent = getStoredContent(storageKey, starterContent);
                if (editorRef.current) {
                    document.execCommand('defaultParagraphSeparator', false, 'p');
                    editorRef.current.innerHTML = nextContent;
                    prepareEditorDom(editorRef.current);
                    setIsEmpty(!normalizeEditorHtml(editorRef.current.innerHTML));
                } else {
                    setIsEmpty(!normalizeEditorHtml(nextContent));
                }
            }, [isOpen, storageKey, starterContent]);

            useEffect(() => {
                if (!isOpen) return;
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    document.body.style.overflow = previousOverflow;
                };
            }, [isOpen]);

            useEffect(() => {
                if (!isOpen || !editorRef.current) return;
                requestAnimationFrame(() => editorRef.current.focus());
            }, [isOpen]);

            if (!isOpen) return null;

            const persistEditorContent = () => {
                if (!editorRef.current) return;
                syncEditorPresentation(editorRef.current);
                const nextContent = normalizeEditorHtml(editorRef.current.innerHTML);
                setIsEmpty(!nextContent);
                saveStoredContent(storageKey, nextContent || starterContent);
            };

            const saveSelection = () => {
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0) {
                    selectionRef.current = selection.getRangeAt(0).cloneRange();
                }
            };

            const restoreSelection = () => {
                const selection = window.getSelection();
                if (selection && selectionRef.current) {
                    selection.removeAllRanges();
                    selection.addRange(selectionRef.current);
                }
            };

            const runCommand = (command, value = null) => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                restoreSelection();
                document.execCommand(command, false, value);
                prepareEditorDom(editorRef.current);
                persistEditorContent();
                saveSelection();
            };

            const handleEditorKeyDown = (event) => {
                if (event.key !== 'Enter') return;

                event.preventDefault();
                editorRef.current.focus();
                restoreSelection();

                if (event.shiftKey) {
                    document.execCommand('insertLineBreak', false, null);
                } else {
                    document.execCommand('insertParagraph', false, null);
                }

                syncEditorPresentation(editorRef.current);
                persistEditorContent();
                saveSelection();
            };

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/35 backdrop-blur-sm px-3 py-4 sm:px-5 sm:py-5"
                    onClick={onClose}
                >
                    <div
                        className="flex h-[92vh] w-full max-w-5xl flex-col overflow-hidden rounded-[28px] border border-white/70 bg-gradient-to-br from-purple-50 via-white to-teal-50 shadow-2xl sm:h-[94vh]"
                        onClick={(event) => event.stopPropagation()}
                    >
                        <div className="flex items-center justify-between gap-4 border-b border-purple-100 px-5 py-3 sm:px-6 sm:py-3.5">
                            <div className="pt-0.5">
                                <p className="text-xs font-bold uppercase tracking-[0.2em] text-purple-500">{headerLabel}</p>
                            </div>
                            <button
                                type="button"
                                onClick={onClose}
                                className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/80 text-gray-500 transition-colors hover:bg-white hover:text-gray-700"
                                aria-label={`Close ${title}`}
                            >
                                &#10005;
                            </button>
                        </div>

                        <div className="flex min-h-0 flex-1 flex-col px-4 py-3 sm:px-6 sm:py-4">
                            <div className="mb-3 flex flex-wrap gap-1.5 rounded-2xl bg-white/80 p-2 shadow-sm">
                                <ToolbarButton label="B" title="Bold" onClick={() => runCommand('bold')} className="font-bold" />
                                <ToolbarButton label="I" title="Italic" onClick={() => runCommand('italic')} className="italic" />
                                <ToolbarButton label="U" title="Underline" onClick={() => runCommand('underline')} className="underline" />
                                <ToolbarButton label={<ListIcon />} title="Bullet List" onClick={() => runCommand('insertUnorderedList')} />
                                <ToolbarButton label={<AlignLeftIcon />} title="Align Left" onClick={() => runCommand('justifyLeft')} />
                                <ToolbarButton label={<AlignCenterIcon />} title="Align Center" onClick={() => runCommand('justifyCenter')} />
                                <ToolbarButton label={<AlignRightIcon />} title="Align Right" onClick={() => runCommand('justifyRight')} />
                                <label className="ml-auto min-w-[88px] sm:min-w-[96px]">
                                    <span className="sr-only">Font size</span>
                                    <select
                                        defaultValue="4"
                                        onChange={(event) => runCommand('fontSize', event.target.value)}
                                        className="h-9 w-full rounded-xl border border-purple-100 bg-violet-50 px-3 py-1 text-sm font-semibold text-gray-700 outline-none focus:border-purple-300"
                                    >
                                        {FONT_SIZE_OPTIONS.map((option) => (
                                            <option key={option.value} value={option.value}>{option.label}</option>
                                        ))}
                                    </select>
                                </label>
                            </div>

                            <div className="min-h-0 flex-1 rounded-2xl border border-purple-100 bg-white/90 shadow-inner">
                                <div
                                    ref={editorRef}
                                    contentEditable
                                    suppressContentEditableWarning
                                    className={`editor-surface ${editorClassName} h-full overflow-y-auto rounded-2xl px-4 py-4 text-base text-gray-700 sm:px-5 sm:py-5 ${isEmpty ? 'editor-empty' : ''}`}
                                    data-placeholder={placeholder}
                                    onInput={persistEditorContent}
                                    onKeyDown={handleEditorKeyDown}
                                    onKeyUp={saveSelection}
                                    onMouseUp={saveSelection}
                                    onBlur={persistEditorContent}
                                />
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        // --- APP ---
        function ShutdownRoutineApp() {
            const [currentScreen, setCurrentScreen] = useState(() => getScreenFromHash());
            const [completedSteps, setCompletedSteps] = useState(new Set());
            const [currentTime, setCurrentTime] = useState('');
            const [currentDate, setCurrentDate] = useState('');
            const [showAnimation, setShowAnimation] = useState(true);
            const [welcomeMessage, setWelcomeMessage] = useState('');
            const [finalMessage, setFinalMessage] = useState('');
            const [routineStartTime, setRoutineStartTime] = useState(null);
            const [elapsedTime, setElapsedTime] = useState(0);
            const [activeModalStep, setActiveModalStep] = useState(null);

            useEffect(() => {
                setWelcomeMessage(generateWelcomeMessage());
                setFinalMessage(generateFinalMessage());
            }, []);

            useEffect(() => {
                const updateTime = () => {
                const now = new Date();
                const bogotaTime = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Bogota',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                }).format(now);
                
                const bogotaDate = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Bogota',
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }).format(now);
                
                setCurrentTime(bogotaTime);
                setCurrentDate(bogotaDate);
                };

                updateTime();
                const interval = setInterval(updateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                let interval;
                if (routineStartTime) {
                interval = setInterval(() => {
                    const now = Date.now();
                    setElapsedTime(Math.floor((now - routineStartTime) / 1000));
                }, 1000);
                }
                return () => {
                if (interval) clearInterval(interval);
                };
            }, [routineStartTime]);

            useEffect(() => {
                if (currentScreen === 'moonrise') {
                setShowAnimation(true);
                const fadeTimer = setTimeout(() => {
                    setShowAnimation(false);
                }, 3000);
                
                const transitionTimer = setTimeout(() => {
                    setCurrentScreen('welcome');
                }, 4000);
                
                return () => {
                    clearTimeout(fadeTimer);
                    clearTimeout(transitionTimer);
                };
                }
            }, [currentScreen]);

            useEffect(() => {
                const handleHashChange = () => {
                    setCurrentScreen(getScreenFromHash());
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                const nextHash = getHashFromScreen(currentScreen);
                if (window.location.hash !== nextHash) {
                    window.location.hash = nextHash;
                }
            }, [currentScreen]);

            const generateWelcomeMessage = () => {
                const messages = [
                "The workday ends here, Diana. This is your sacred transition from productivity to rest and restoration.",
                "10 PM is your boundary, your promise to yourself. Let's honor this commitment and close the day with intention.",
                "Your Shutdown Routine is an act of self-care and wisdom. It's time to step away from work and into evening peace.",
                "The night is calling you to rest, but first - let's properly close this chapter of your day with mindful intention.",
                "This routine is your bridge from the busy day to restful evening. You deserve this transition, this care, this boundary."
                ];
                
                return messages[Math.floor(Math.random() * messages.length)];
            };

            const generateFinalMessage = () => {
                const messages = [
                "Your workday is officially closed, Diana. You've honored your 10 PM boundary and given yourself the gift of proper transition. Now let rest embrace you.",
                "Eleven steps completed, work mode deactivated. You've chosen rest over overwork, boundaries over burnout. Your evening ritual awaits.",
                "The Shutdown Routine is complete - you've broken the cycle of endless work and chosen restoration. Step into your rooting ritual with peace.",
                "From moon rise to this moment of closure, you've practiced the art of ending well. Your commitment to rest is a commitment to your wellbeing.",
                "Work is done, boundaries honored, evening reclaimed. You've given yourself what you need most - the space to truly rest and restore."
                ];
                
                return messages[Math.floor(Math.random() * messages.length)];
            };

            const ritualSteps = useMemo(() => ([
                { id: 1, title: "Activate SDR with your shiny Sunny", description: "Begin your shutdown with Sunny's evening guidance 🌙" },
                { id: 2, title: "Listen to Waking Up Moment", description: "Ground yourself with mindful evening awareness", link: "https://app.wakingup.com/my-library" },
                { id: 3, title: "Planning for Tomorrow", description: "Set intentions and organize thoughts for tomorrow", warning: "⚠️ Keep this focused and brief - don't get lost or carried away in planning" },
                { id: 4, title: "Daily Check-In", description: "Review daily habits and personal breakthrough commitments", link: "https://habits.sadhanas.app" },
                { id: 5, title: "Mantras", description: "Connect with your weekly mantras and affirmations" },
                { id: 6, title: "Lessons & Wisdom", description: "Reflect on key lessons from the past week and integrate them into your practice" },
                { id: 7, title: "Core Commitments", description: "Align with your deeper wisdom", link: "https://chatgpt.com/g/g-p-68b27462c59c8191a5c8686b86a23216-personal/c/6a136e53-a2ec-83e9-b343-e945d521bbc7" },
                { id: 8, title: "D RAM 2025 Review", description: "Review and reflect on your journal entries from one year ago" },
                { id: 9, title: "Write D Journal Entry", description: "Process your day through reflective journaling" },
                { id: 10, title: "Close the Routine with Sunny", description: "Complete your shutdown with final Sunny wisdom" },
                { id: 11, title: "Get Ready for Your Rooting Ritual", description: "Transition into your evening restoration practice" }
            ]), []);

            const completeStep = (stepId) => {
                setCompletedSteps(prev => new Set([...prev, stepId]));
            };

            const goToNextStep = (stepId) => {
                if (stepId < TOTAL_STEPS) {
                setCurrentScreen(`step-${stepId + 1}`);
                } else {
                setCurrentScreen('complete');
                }
            };

            const goBack = () => {
                if (currentScreen === 'welcome') {
                setCurrentScreen('moonrise');
                setShowAnimation(true);
                } else if (currentScreen.startsWith('step-')) {
                const stepNumber = parseInt(currentScreen.split('-')[1]);
                if (stepNumber === 1) {
                    setCurrentScreen('welcome');
                } else {
                    setCurrentScreen(`step-${stepNumber - 1}`);
                }
                } else if (currentScreen === 'complete') {
                setCurrentScreen(`step-${TOTAL_STEPS}`);
                }
            };
            
            const resetApp = () => {
                setCurrentScreen('moonrise');
                setCompletedSteps(new Set());
                setShowAnimation(true);
                setRoutineStartTime(null);
                setElapsedTime(0);
                setWelcomeMessage(generateWelcomeMessage());
                setFinalMessage(generateFinalMessage());
                setActiveModalStep(null);
            };

            const openModalForStep = (stepId) => {
                if (MODAL_STEP_CONFIG[stepId]) {
                    setActiveModalStep(stepId);
                }
            };

            const closeModal = () => {
                setActiveModalStep(null);
            };

            const startRoutine = () => {
                setRoutineStartTime(Date.now());
                setCurrentScreen('step-1');
            };

            const formatElapsedTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const activeModalConfig = activeModalStep ? MODAL_STEP_CONFIG[activeModalStep] : null;

            // SCREEN: MOONRISE
            if (currentScreen === 'moonrise') {
                return (
                <div className="min-h-screen relative overflow-hidden bg-gradient-to-b from-indigo-900 via-purple-800 to-teal-400 transition-opacity duration-1000">
                    <div className={`absolute inset-0 flex items-center justify-center ${!showAnimation ? 'fade-out' : ''}`}>
                    <div className="moon-animation">
                        <div className="relative">
                        <div className="glow absolute inset-0 w-32 h-32">
                            <div className="absolute inset-0 bg-gradient-radial from-blue-300/30 to-transparent rounded-full w-48 h-48 -translate-x-8 -translate-y-8"></div>
                        </div>
                        <MoonIcon className="w-32 h-32 text-blue-200" />
                        </div>
                    </div>
                    </div>
                </div>
                );
            }

            // SCREEN: WELCOME
            if (currentScreen === 'welcome') {
                return (
                <div className="min-h-screen bg-gradient-to-br from-purple-100 via-blue-50 to-teal-100 p-6 fade-in">
                    <div className="max-w-md mx-auto pt-16">
                    <div className="text-center">
                        <div className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-6 py-3 mb-6">
                        <ClockIcon className="w-5 h-5 text-purple-600" />
                        <span className="text-lg font-medium text-gray-700">{currentTime} • Bogotá</span>
                        </div>
                        
                        <h1 className="text-3xl font-bold text-gray-800 mb-4">Time to Close the Day, Diana</h1>
                        <p className="text-gray-600 text-lg mb-12">{currentDate}</p>
                        
                        <div className="mb-12 px-4">
                        <p className="text-gray-700 text-xl leading-relaxed font-medium">
                            {welcomeMessage}
                        </p>
                        </div>
                        
                        <button onClick={startRoutine} className="w-full bg-gradient-to-r from-purple-400 to-teal-400 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                        Begin Your Shutdown Routine
                        <ChevronRightIcon className="w-5 h-5" />
                        </button>
                    </div>
                    </div>
                </div>
                );
            }

            // SCREEN: STEPS
            if (currentScreen.startsWith('step-')) {
                const stepNumber = parseInt(currentScreen.split('-')[1]);
                const step = ritualSteps[stepNumber - 1];
                const isCompleted = completedSteps.has(stepNumber);
                const totalSteps = TOTAL_STEPS;
                const hasModal = Boolean(MODAL_STEP_CONFIG[stepNumber]);

                return (
                <>
                <div className="min-h-screen bg-gradient-to-br from-purple-100 via-blue-50 to-teal-100 relative p-6">
                    {/* Back Button - FIXED TO TOP-LEFT (top-6 left-6) and Z-indexed for a clear view */}
                    <div className="absolute top-6 left-6 z-10">
                        <button onClick={goBack} className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-4 py-2 text-gray-700 hover:bg-white/80 transition-all duration-300">
                        <ArrowLeftIcon className="w-4 h-4" />
                        Back
                        </button>
                    </div>
                    
                    {/* Main container adjusted for button clearance - now uses pt-20 for the new button position */}
                    <div className="max-w-[34rem] mx-auto pt-10"> 
                    
                    {/* Progress - relies on pt-20 from the main container for spacing */}
                    <div className="mb-2">
                        <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-medium text-gray-600">Step {stepNumber} of {totalSteps}</span>
                        <span className="text-sm font-medium text-gray-600">{Math.round((stepNumber / totalSteps) * 100)}%</span>
                        </div>
                        <div className="w-full bg-white/60 rounded-full h-2">
                        <div className="bg-gradient-to-r from-purple-400 to-teal-400 h-2 rounded-full transition-all duration-500" style={{ width: `${(stepNumber / totalSteps) * 100}%` }}></div>
                        </div>
                        
                        {/* Timer */}
                        {routineStartTime && (
                        <div className="flex justify-center mt-5 mb-5">
                            <div className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-4 py-2">
                            <ClockIcon className="w-4 h-4 text-purple-600" />
                            <span className="text-sm font-medium text-gray-700">{formatElapsedTime(elapsedTime)}</span>
                            </div>
                        </div>
                        )}
                    </div>

                    {/* Content */}
                    <div className="bg-white/70 backdrop-blur-sm rounded-3xl p-8 shadow-lg mb-8 text-center">
                        <div className="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-r from-purple-400 to-teal-400 rounded-full mb-6">
                        <span className="text-white text-lg font-bold">{stepNumber}</span>
                        </div>
                        
                        <h2 className="text-2xl font-bold text-gray-800 mb-4">{step.title}</h2>
                        <p className="text-gray-600 text-lg mb-6">{step.description}</p>
                        
                        {step.warning && (
                        <p className="text-orange-600 text-sm mb-6 italic">{step.warning}</p>
                        )}
                        
                        {step.link && (
                        <a href={step.link} target="_blank" rel="noopener noreferrer" className="inline-block bg-gradient-to-r from-blue-400 to-purple-400 text-white px-6 py-3 rounded-xl font-semibold mb-6 hover:shadow-lg transition-all duration-300">
                            Open Link →
                        </a>
                        )}
                        {hasModal && (
                        <div className="mb-2">
                            <button
                            type="button"
                            onClick={() => openModalForStep(stepNumber)}
                            className="inline-block bg-gradient-to-r from-blue-400 to-purple-400 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all duration-300"
                            >
                            Open
                            </button>
                        </div>
                        )}
                    </div>

                    {/* Buttons */}
                    <div className="space-y-4">
                        {!isCompleted && (
                        <button onClick={() => completeStep(stepNumber)} className="w-full bg-gradient-to-r from-emerald-400 to-teal-500 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                            <CheckIcon className="w-5 h-5" />
                            Mark Complete
                        </button>
                        )}
                        
                        {isCompleted && (
                        <button onClick={() => goToNextStep(stepNumber)} className="w-full bg-gradient-to-r from-purple-400 to-teal-400 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                            {stepNumber === totalSteps ? 'Complete Shutdown' : 'Next Step'}
                            <ChevronRightIcon className="w-5 h-5" />
                        </button>
                        )}
                    </div>
                    </div>
                </div>
                {activeModalConfig && (
                    <RichTextModal
                    isOpen={Boolean(activeModalConfig)}
                    title={activeModalConfig.title}
                    headerLabel={activeModalConfig.headerLabel}
                    storageKey={activeModalConfig.storageKey}
                    starterContent={STARTER_CONTENT[activeModalConfig.key]}
                    placeholder={activeModalConfig.placeholder}
                    editorClassName={activeModalConfig.editorClassName}
                    onClose={closeModal}
                    />
                )}
                </>
                );
            }

            // SCREEN: COMPLETE
            if (currentScreen === 'complete') {
                return (
                <div className="min-h-screen bg-gradient-to-br from-purple-100 via-blue-50 to-teal-100 relative p-6">
                    {/* Back Button - FIXED TO TOP-LEFT (top-6 left-6) and Z-indexed for a clear view */}
                    <div className="absolute top-6 left-6 z-10">
                        <button onClick={goBack} className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-4 py-2 text-gray-700 hover:bg-white/80 transition-all duration-300">
                        <ArrowLeftIcon className="w-4 h-4" />
                        Back
                        </button>
                    </div>
                    
                    <div className="max-w-md mx-auto pt-20"> 
                    <div className="text-center mb-8">
                        <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-r from-teal-400 to-purple-500 rounded-full mb-6">
                        <MoonIcon className="w-10 h-10 text-white" />
                        </div>
                        
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">Shutdown Complete! </h1>                     
                        {routineStartTime && (
                        <div className="mb-9"> {/* Reduced margin bottom for tighter look */}
                            <p className="text-gray-600 text-base">
                            Total time: <span className="font-semibold text-purple-600 text-2xl">{formatElapsedTime(elapsedTime)}</span> {/* Increased timer size to text-2xl */}
                            </p>
                        </div>
                        )}
                    </div>

                    <div className="text-center mb-12 px-4">
                        <p className="text-gray-700 text-xl leading-relaxed font-medium">
                        {finalMessage}
                        </p>
                    </div>

                    <button onClick={resetApp} className="w-full bg-gradient-to-r from-purple-400 to-teal-400 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                        <RefreshCwIcon className="w-5 h-5" />
                        Start New Shutdown Routine
                    </button>
                    </div>
                </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShutdownRoutineApp />);
    </script>
</body>
</html>
